<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ניהול תיקונים - ישיבת בני צבי</title>
    <link rel="manifest" href="manifest-manager.json">
    <meta name="theme-color" content="#0056b3">
    <link rel="icon" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="ניהול תיקונים">

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 20px;
            background-color: #f0f2f5;
            position: relative;
            min-height: 100vh;
        }
        body::before {
            content: "";
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 250px; height: 250px;
            background-image: url('icon-512.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0.12;
            z-index: -1;
            pointer-events: none;
        }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); position: relative; }
        .hidden { display: none !important; }
        h2, h3 { text-align: center; color: #333; margin-top: 0; }
        textarea, button { width: 100%; margin-bottom: 15px; padding: 12px; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; font-size: 16px; font-family: inherit; }
        button { cursor: pointer; font-weight: bold; border: none; color: white; transition: 0.2s; }

        .btn-blue { background-color: #0056b3; } .btn-blue:hover { background-color: #004494; }
        .btn-gray { background-color: #6c757d; } .btn-gray:hover { background-color: #5a6268; }
        .btn-green { background-color: #198754; } .btn-green:hover { background-color: #157347; }
        .btn-red { background-color: #dc3545; } .btn-red:hover { background-color: #bb2d3b; }

        .manager-list { list-style: none; padding: 0; }
        .manager-list li { background: #fff; border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
        .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; color: white; margin-bottom: 5px; }
        .badge-green { background: #198754; } .badge-red { background: #dc3545; } .badge-orange { background: #fd7e14; }
        .task-img { max-width: 100%; border-radius: 8px; margin-top: 10px; }

        .drag-handle { font-size: 24px; color: #adb5bd; cursor: grab; user-select: none; }
        .sortable-ghost { opacity: 0.4; background-color: #f8f9fa; }
        .toggle-history-btn { background: transparent; color: #333; font-size: 22px; width: auto; margin: 0; padding: 5px; border: none; box-shadow: none; border-radius: 50%; }
        .sync-indicator { font-size: 12px; color: #888; text-align: center; margin-bottom: 15px; }
        .conn-error { font-size: 13px; color: #dc3545; text-align: center; margin-bottom: 15px; background: #fce8ea; border-radius: 8px; padding: 8px; }
        .action-row { display: flex; gap: 8px; }
        .action-row button { width: auto; flex: none; padding: 8px 14px; margin: 0; }
        .row-actions-col { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .thumb-btn { width: auto; background: transparent; color: #333; padding: 5px 10px; margin: 0; box-shadow: none; }

        /* תצוגת עובד מדומה */
        .task-card { background: #fdfdfd; margin-bottom: 12px; border-radius: 8px; border: 1px solid #e1e1e1; overflow: hidden; }
        .task-header { padding: 15px; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }
        .task-actions { padding: 15px; background: #f8f9fa; border-top: 1px solid #eee; display: flex; gap: 10px; }
        .task-actions .btn { padding: 12px; border: none; border-radius: 6px; color: white; font-weight: bold; flex: 1; cursor: pointer; font-size: 16px; }
        .first-task-card { border: 2px solid #0056b3; box-shadow: 0 4px 12px rgba(0,86,179,0.15); }
        .first-task-card .task-header { font-size: 20px; font-weight: bold; color: #0056b3; }
    </style>
</head>
<body>

    <div class="container" id="manager-screen">
        <button onclick="toggleWorkerPreview()" style="position: absolute; top: 15px; left: 15px; width: auto; padding: 5px 10px; background: #6c757d; border-radius: 5px; font-size: 12px; margin: 0;">👁️ תצוגת עובד</button>

        <h2>ניהול משימות</h2>
        <div id="conn-error" class="conn-error hidden">לא ניתן להתחבר. יש לבדוק את חיבור האינטרנט.</div>

        <textarea id="task-input" rows="4" placeholder="הכנס משימות (כל שורה = משימה נפרדת)"></textarea>
        <p style="font-size:12px; color:#888; margin:-8px 0 12px; text-align:center;">🔍 כל משימה תדרוש אישור מנהל אחרי ביצוע</p>
        <label class="photo-picker" style="display:flex; align-items:center; justify-content:center; gap:8px; padding:12px; border:1.5px dashed #ccc; border-radius:8px; color:#888; font-weight:normal; margin-bottom:15px; cursor:pointer;">
            <span id="add-photo-label">📷 צרף תמונה (לא חובה)</span>
            <input type="file" id="add-photo-input" accept="image/*" capture="environment" style="display:none;">
        </label>
        <div id="add-photo-preview-wrap"></div>
        <button class="btn-blue" id="add-btn" onclick="addTasks()">תרגם והוסף משימות</button>

        <h3 style="border-bottom: 2px solid #eee; padding-bottom: 5px; margin-top: 30px;">משימות פעילות (ניתן לגרור)</h3>
        <ul id="list-active" class="manager-list"></ul>

        <h3 style="border-bottom: 2px solid #eee; padding-bottom: 5px; margin-top: 30px; color: #fd7e14;">ממתין לווידוא מנהל</h3>
        <ul id="list-pending" class="manager-list"></ul>

        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #eee; margin-top: 30px; padding-bottom: 5px;">
            <h3 style="margin: 0; color: #6c757d; border: none; padding: 0;">היסטוריה</h3>
            <button class="toggle-history-btn" onclick="document.getElementById('list-history').classList.toggle('hidden')">🕒</button>
        </div>
        <ul id="list-history" class="manager-list hidden"></ul>
    </div>

    <!-- מסך תצוגת עובד מדומה למנהל -->
    <div class="container hidden" id="worker-preview" dir="ltr">
        <h2 style="color: #0056b3;">Vista previa del empleado</h2>
        <p style="text-align: center; color: #888; font-size: 13px; margin-top:-10px;">(תצוגה חיה - לחיצה על הכפתורים כאן מבצעת פעולות אמיתיות)</p>
        <div id="preview-list"></div>
        <button class="btn-gray" onclick="toggleWorkerPreview()" style="margin-top: 10px;">⬅ חזור למסך ניהול</button>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyWWUGpf8LXSl8e3So7D6NLdD6Q9jZVezNG5v1lBuf3_KpO3rv_S2CZWYiNx4AmOrQQ0A/exec";
        let tasks = [];
        let activeSortable = null;
        let isSyncing = false;
        let inWorkerPreview = false;

        function setConnError(on) {
            document.getElementById('conn-error').classList.toggle('hidden', !on);
        }
        function esc(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        async function apiPost(payload) {
            let result;
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                result = await res.json();
            } catch (e) {
                alert('שגיאת תקשורת: ' + e);
                return { ok: false, error: String(e) };
            }
            if (!result || !result.ok) {
                alert('שגיאה מהשרת: ' + (result && result.error ? result.error : 'לא ידועה'));
            }
            return result;
        }

        async function syncFromCloud() {
            if (isSyncing) return;
            isSyncing = true;
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                if (data && data.ok) {
                    tasks = data.tasks;
                    setConnError(false);
                    renderAll();
                } else {
                    setConnError(true);
                }
            } catch (e) {
                setConnError(true);
            }
            isSyncing = false;
        }

        function renderAll() {
            renderManager();
            if (inWorkerPreview) renderPreview();
        }

        function getDaysWaitingHe(task) {
            const days = Math.floor((Date.now() - new Date(task.createdAt).getTime()) / (1000 * 60 * 60 * 24));
            if (days <= 0) return 'נוצר היום';
            if (days === 1) return 'ממתין יום אחד';
            if (days === 2) return 'ממתין יומיים';
            return `ממתין ${days} ימים`;
        }
        function getDaysWaitingEs(task) {
            const days = Math.floor((Date.now() - new Date(task.createdAt).getTime()) / (1000 * 60 * 60 * 24));
            return days <= 0 ? 'Hoy' : `Hace ${days} día${days > 1 ? 's' : ''}`;
        }

        let addPendingPhoto = null;
        document.getElementById('add-photo-input').addEventListener('change', function (e) {
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (ev) {
                const img = new Image();
                img.onload = function () {
                    const scale = Math.min(400 / img.width, 1);
                    const canvas = document.createElement('canvas');
                    canvas.width = img.width * scale;
                    canvas.height = img.height * scale;
                    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                    addPendingPhoto = canvas.toDataURL('image/jpeg', 0.5);
                    document.getElementById('add-photo-preview-wrap').innerHTML = `<img src="${addPendingPhoto}" style="max-width:100%; border-radius:8px; margin-bottom:12px;">`;
                    document.getElementById('add-photo-label').innerText = '📷 תמונה צורפה (לחץ להחלפה)';
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        });

        async function addTasks() {
            const input = document.getElementById('task-input').value.trim();
            if (!input) return;
            const lines = input.split('\n').map(l => l.trim()).filter(l => l !== '');
            const btn = document.getElementById('add-btn');
            btn.disabled = true;
            btn.innerText = 'מתרגם ומוסיף...';

            const payload = { action: 'addBulk', lines };
            if (addPendingPhoto) payload.photoBase64 = addPendingPhoto;
            await apiPost(payload);

            document.getElementById('task-input').value = '';
            document.getElementById('add-photo-input').value = '';
            document.getElementById('add-photo-preview-wrap').innerHTML = '';
            document.getElementById('add-photo-label').innerText = '📷 צרף תמונה (לא חובה)';
            addPendingPhoto = null;
            btn.disabled = false;
            btn.innerText = 'תרגם והוסף משימות';
            await syncFromCloud();
        }

        function renderManager() {
            const listActive = document.getElementById('list-active');
            const listPending = document.getElementById('list-pending');
            const listHistory = document.getElementById('list-history');

            const active = tasks.filter(t => t.status === 'active').sort((a,b)=>(Number(a.order)||0)-(Number(b.order)||0));
            const pending = tasks.filter(t => t.status === 'pending_confirm' || t.status === 'issue_pending')
                .sort((a,b)=> new Date(b.completedAt) - new Date(a.completedAt));
            const history = tasks.filter(t => t.status === 'archived')
                .sort((a,b)=> new Date(b.completedAt) - new Date(a.completedAt));

            listActive.innerHTML = active.map(task => {
                const waitText = getDaysWaitingHe(task);
                let html = `<li data-id="${task.id}">
                    <div><strong>${esc(task.textHe)}</strong><br><span style="font-size:12px; color:#666;">⏳ ${esc(waitText)}</span>`;
                if (task.reasonPhotoBase64) html += `<br><img src="${task.reasonPhotoBase64}" class="task-img" style="max-width:120px;">`;
                html += `</div>
                    <div class="row-actions-col">
                        <button class="btn-red thumb-btn" style="background:#dc3545;color:#fff;" onclick="deleteTask('${task.id}')">מחק</button>
                        <div class="drag-handle">☰</div>
                    </div>
                </li>`;
                return html;
            }).join('');

            listPending.innerHTML = pending.map(task => {
                const waitText = getDaysWaitingHe(task);
                const isIssue = task.status === 'issue_pending';
                const badgeClass = isIssue ? 'badge-red' : 'badge-green';
                const badgeText = isIssue ? 'לא תוקן ⚠️ (ממתין להחלטה)' : 'תוקן ✅ (ממתין לאישור)';
                let html = `<li>
                    <div><strong>${esc(task.textHe)}</strong><br><span style="font-size:12px; color:#666;">⏳ ${esc(waitText)}</span><br>
                    <span class="badge ${badgeClass}" style="margin-top:5px;">${badgeText}</span>`;
                if (task.reasonText) html += `<p style="margin:5px 0; font-size:13px; background:#f0f0f0; padding:6px; border-radius:4px;">הערת עובד: ${esc(task.reasonText)}</p>`;
                if (task.reasonPhotoBase64) html += `<img src="${task.reasonPhotoBase64}" class="task-img">`;
                html += `</div>`;
                if (isIssue) {
                    html += `<div class="row-actions-col">
                        <button class="btn-red thumb-btn" style="background:#dc3545;color:#fff;" onclick="deleteTask('${task.id}')">מחק</button>
                        <button class="btn-gray thumb-btn" style="background:#6c757d;color:#fff;" onclick="resubmitTask('${task.id}')">הגש שוב</button>
                    </div>`;
                } else {
                    html += `<button class="btn-green" style="width:auto; padding:8px 15px; margin:0;" onclick="confirmArchive('${task.id}')">אשר לארכיון</button>`;
                }
                html += `</li>`;
                return html;
            }).join('');

            listHistory.innerHTML = history.map(task => {
                const waitText = getDaysWaitingHe(task);
                return `<li>
                    <div><strong>${esc(task.textHe)}</strong><br><span style="font-size:12px; color:#666;">⏳ ${esc(waitText)}</span><br>
                    <span class="badge badge-green" style="margin-top:5px;">הושלם ואושר</span></div>
                    <button class="btn-gray thumb-btn" style="background:#6c757d;color:#fff;" onclick="undoHistory('${task.id}')">↩ בטל</button>
                </li>`;
            }).join('');

            if (activeSortable) activeSortable.destroy();
            activeSortable = Sortable.create(listActive, {
                animation: 150,
                handle: '.drag-handle',
                ghostClass: 'sortable-ghost',
                onEnd: async function () {
                    // מעדכנים את הסדר המקומי מיד לפי מה שכבר זז על המסך
                    const ids = Array.from(listActive.children).map(li => li.dataset.id);
                    ids.forEach((id, i) => {
                        const t = tasks.find(x => x.id === id);
                        if (t) t.order = i;
                    });
                    const result = await apiPost({ action: 'reorder', ids });
                    if (!result || !result.ok) await syncFromCloud();
                }
            });
        }

        function maxActiveOrder_() {
            const orders = tasks.filter(t => t.status === 'active').map(t => Number(t.order) || 0);
            return orders.length ? Math.max(...orders) : 0;
        }

        async function deleteTask(id) {
            if (!confirm('למחוק משימה?')) return;
            const backup = tasks;
            tasks = tasks.filter(t => t.id !== id);
            renderAll();
            const result = await apiPost({ action: 'deleteTask', id });
            if (!result || !result.ok) { tasks = backup; await syncFromCloud(); }
        }
        async function confirmArchive(id) {
            const t = tasks.find(x => x.id === id);
            if (t) t.status = 'archived';
            renderAll();
            const result = await apiPost({ action: 'confirmArchive', id });
            if (!result || !result.ok) await syncFromCloud();
        }
        async function resubmitTask(id) {
            const t = tasks.find(x => x.id === id);
            if (t) {
                t.status = 'active';
                t.reasonText = '';
                t.reasonPhotoBase64 = '';
                t.order = maxActiveOrder_() + 1;
            }
            renderAll();
            const result = await apiPost({ action: 'resubmitTask', id });
            if (!result || !result.ok) await syncFromCloud();
        }
        async function undoHistory(id) {
            const t = tasks.find(x => x.id === id);
            if (t) {
                t.status = 'active';
                t.order = maxActiveOrder_() + 1;
            }
            renderAll();
            const result = await apiPost({ action: 'undoHistory', id });
            if (!result || !result.ok) await syncFromCloud();
        }

        /* ---------------- תצוגת עובד מדומה (חיה) ---------------- */
        function toggleWorkerPreview() {
            inWorkerPreview = !inWorkerPreview;
            document.getElementById('manager-screen').classList.toggle('hidden', inWorkerPreview);
            document.getElementById('worker-preview').classList.toggle('hidden', !inWorkerPreview);
            document.body.dir = inWorkerPreview ? 'ltr' : 'rtl';
            if (inWorkerPreview) renderPreview();
        }

        function renderPreview() {
            const list = document.getElementById('preview-list');
            const active = tasks.filter(t => t.status === 'active').sort((a,b)=>(Number(a.order)||0)-(Number(b.order)||0));
            if (active.length === 0) {
                list.innerHTML = '<h3 style="text-align:center; color:#888;">No hay tareas 🎉</h3>';
                return;
            }
            list.innerHTML = active.map((task, index) => {
                const isFirst = index === 0;
                const daysText = getDaysWaitingEs(task);
                const text = task.textEs || task.textHe;
                return `
                    <div class="task-card ${isFirst ? 'first-task-card' : ''}">
                        <div class="task-header" ${isFirst ? '' : `onclick="this.nextElementSibling.classList.toggle('hidden')"`} style="cursor: ${isFirst ? 'default' : 'pointer'};">
                            <div>
                                🔧 ${esc(text)}<br>
                                <span style="font-size: 13px; color: #888; font-weight: normal;">⏳ ${daysText}</span>
                            </div>
                            ${isFirst ? '' : '<span>🔽</span>'}
                        </div>
                        <div class="task-actions ${isFirst ? '' : 'hidden'}">
                            <button class="btn" style="background:#198754;" onclick="previewMarkFixed('${task.id}')">✅ Reparado</button>
                            <button class="btn" style="background:#dc3545;" onclick="previewOpenCantFix('${task.id}')">⚠️ No se puede</button>
                        </div>
                    </div>`;
            }).join('');
        }

        async function previewMarkFixed(id) {
            tasks = tasks.filter(t => t.id !== id);
            renderAll();
            const result = await apiPost({ action: 'markFixed', id });
            if (!result || !result.ok) await syncFromCloud();
        }

        function previewOpenCantFix(id) {
            const note = prompt('¿Qué pasó? (Opcional)');
            if (note === null) return;
            tasks = tasks.filter(t => t.id !== id);
            renderAll();
            apiPost({ action: 'reportIssue', id, reasonTextEs: note.trim() }).then(result => {
                if (!result || !result.ok) syncFromCloud();
            });
        }

        window.onload = () => { syncFromCloud(); };
        setInterval(syncFromCloud, 10000);
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
    </script>
</body>
</html>
